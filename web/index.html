<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Anthony Aniobi - Flutter Developer Portfolio">

  <!-- Open Graph -->
  <meta property="og:title" content="Anthony Aniobi | Flutter Developer" />
  <meta property="og:description" content="Mobile Apps · Games · Full-Stack Engineering" />
  <meta property="og:type" content="website" />

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Anthony Aniobi">
  <link rel="apple-touch-icon" href="icons/programing.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.ico"/>

  <title>portfolio</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      background-color: #0A0C10;
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #0A0C10;
    }

    .logo-letter {
      width: 56px;
      height: 56px;
      background: #00E5C8;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      font-size: 28px;
      font-weight: 800;
      color: #0A0C10;
      margin-bottom: 24px;
    }

    .loading-bar {
      width: 120px;
      height: 2px;
      background: #1E2330;
      border-radius: 1px;
      overflow: hidden;
    }

    .loading-progress {
      height: 100%;
      width: 0%;
      background: #00E5C8;
      animation: load 1.5s ease-in-out infinite;
    }

    @keyframes load {
      0% { width: 0%; margin-left: 0; }
      50% { width: 60%; margin-left: 20%; }
      100% { width: 0%; margin-left: 100%; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="logo-letter">A</div>
    <div class="loading-bar">
      <div class="loading-progress"></div>
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('loading').remove();
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
